<script>
/* Live room for the standalone site: public MQTT broker over WebSocket (no account, works across networks) */
(function(){
if(window.claude&&window.claude.use)return;
var B=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
var room={join:function(name,host){return new Promise(function(res,rej){
 if(!window.mqtt){rej(new Error('mqtt'));return}
 var code=String(name).replace(/^ga-/,'').toLowerCase(),base='gaarena1/'+code+'/',id=Math.random().toString(36).slice(2,10);
 var me={isMe:true,presence:{}},others=new Map(),ls=new Set(),cl=null,bi=0,done=false,gone=false,hb,pr,ft;
 var emit=function(){ls.forEach(function(f){try{f()}catch(e){}})};
 var pub=function(){if(cl&&cl.connected)cl.publish(base+id,JSON.stringify({p:me.presence}),{retain:true,qos:0})};
 var list=function(){return Array.from(others.values()).filter(function(o){return o.presence&&o.presence.nm}).sort(function(a,b){return b.seen-a.seen})};
 var api={peers:function(){var o=list()[0];return o?[me,o]:[me]},
  presence:function(p){for(var k in p){if(p[k]===null)delete me.presence[k];else me.presence[k]=p[k]}pub();emit();return Promise.resolve()},
  onPeers:function(f){ls.add(f);return function(){ls.delete(f)}},
  leave:function(){gone=true;clearInterval(hb);clearInterval(pr);clearTimeout(ft);try{cl.publish(base+id,'',{retain:true});setTimeout(function(){try{cl.end(true)}catch(e){}},300)}catch(e){}return Promise.resolve()}};
 function fail(e){if(!done){done=true;gone=true;clearInterval(hb);clearInterval(pr);clearTimeout(ft);try{cl.end(true)}catch(_){}rej(e)}}
 function ok(){if(!done){done=true;res(api)}}
 function connect(){
  cl=mqtt.connect(B[bi%B.length],{clientId:'ga'+id+bi,reconnectPeriod:2500,connectTimeout:6000,keepalive:30,will:{topic:base+id,payload:'',retain:true,qos:0}});
  cl.on('connect',function(){clearTimeout(ft);cl.subscribe(base+'+',function(err){if(err){fail(err);return}pub();
    if(host)ok();else{var t0=Date.now(),w=setInterval(function(){var h=list().find(function(o){return o.presence.host===1});if(h){clearInterval(w);ok()}else if(Date.now()-t0>6000){clearInterval(w);fail(new Error('noroom'))}},250)}})});
  cl.on('message',function(t,m){var pid=t.slice(base.length);if(pid===id)return;var s=m.toString();if(!s)others.delete(pid);else{try{others.set(pid,{isMe:false,presence:JSON.parse(s).p||{},seen:Date.now()})}catch(e){}}emit()});
  cl.on('error',function(){});
  ft=setTimeout(function(){if(!done&&!gone&&!cl.connected){try{cl.end(true)}catch(e){}bi++;if(bi>=B.length*2)fail(new Error('broker'));else connect()}},7000);
 }
 connect();
 hb=setInterval(function(){pub()},8000);
 pr=setInterval(function(){var n=Date.now(),ch=false;others.forEach(function(o,k){if(n-o.seen>90000){others.delete(k);ch=true}});if(ch)emit()},4000);
})}};
window.claude={use:function(n){return Promise.resolve(n==='room'?room:null)}};
})();
</script>
<style>

.tray{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}

.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}

.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
/* result */
.big{font-family:var(--f1);font-size:clamp(40px,10vw,72px);font-weight:900}
.stars{font-size:42px;letter-spacing:8px;color:var(--tile)}
.center{text-align:center}
.mist{text-align:left;margin-top:14px}
.mist li{margin:6px 0;color:var(--dim)}
/* duel */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.pl{background:var(--board2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.pl.me{border-color:var(--mint)}.pl.opp{border-color:var(--rose)}
.pl b{display:block;font-family:var(--f1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.pl small{color:var(--dim)}
.vsx{font-family:var(--f1);font-weight:900;color:var(--coral)}
.code{font-family:var(--f1);font-weight:900;font-size:54px;letter-spacing:10px;background:var(--tile);color:var(--ink);border-radius:12px;padding:6px 18px;display:inline-block;box-shadow:0 5px 0 var(--tile2)}
.note{color:var(--dim);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--board);font-weight:800;padding:10px 18px;border-radius:99px;z-index:20;box-shadow:0 8px 24px #0008}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (max-width:480px){.opts.two{grid-template-columns:1fr}.vs{grid-template-columns:1fr 1fr}.vsx{display:none}.code{font-size:40px;letter-spacing:6px}}

<script>
/* Standalone live room: two players connect directly (WebRTC via PeerJS, free public broker) */
(function(){
if(window.claude&&window.claude.use)return;
const room={join:(code,host)=>new Promise((res,rej)=>{
  if(!window.Peer){rej(new Error('peerjs'));return}
  let conn=null,other=null,peer=null,done=false;const ls=new Set(),me={isMe:true,presence:{}};
  const emit=()=>ls.forEach(f=>{try{f()}catch(e){}});
  const fail=e=>{if(!done){done=true;try{peer&&peer.destroy()}catch(_){}rej(e)}};
  const api={peers:()=>other?[me,other]:[me],
    presence:async p=>{for(const k in p){if(p[k]===null)delete me.presence[k];else me.presence[k]=p[k]}if(conn&&conn.open)conn.send({p:Object.assign({},me.presence)});emit()},
    onPeers:f=>{ls.add(f);return()=>ls.delete(f)},
    leave:async()=>{try{peer.destroy()}catch(e){}}};
  const attach=c=>{conn=c;
    c.on('data',d=>{if(d&&d.p){other={isMe:false,presence:d.p};emit()}});
    c.on('close',()=>{other=null;emit()});c.on('error',()=>{});
    const hi=()=>c.send({p:Object.assign({},me.presence)});c.open?hi():c.on('open',hi)};
  const id='gaarena-'+String(code).replace(/^ga-/,'').toLowerCase();
  const ok=()=>{if(!done){done=true;res(api)}};
  if(host){peer=new Peer(id);peer.on('open',ok);peer.on('connection',c=>{if(conn&&conn.open){c.close();return}attach(c)});peer.on('error',fail)}
  else{peer=new Peer();peer.on('open',()=>{const c=peer.connect(id,{reliable:true});c.on('open',()=>{attach(c);ok()});c.on('error',fail)});peer.on('error',fail);setTimeout(()=>fail(new Error('timeout')),12000)}
})};
window.claude={use:async n=>n==='room'?room:null};
})();
const Z=[];
Z.push({id:'sen',n:'Sentence Sprint',ic:'S',c:'#6fe0b0',d:'Kinds of sentences, subject, predicate, phrase, clause',
L:[['What is a sentence?','<p>A sentence is a group of words that makes <b>complete sense</b>.</p><div class="rule"><b>Four kinds</b><ul><li>Declarative: a statement</li><li>Interrogative: a question</li><li>Imperative: command, request</li><li>Exclamatory: strong feeling</li></ul></div><p class="ex">How cold the night is!</p>'],
['Subject and predicate','<p>Every sentence has two parts. The <b>subject</b> names who or what we talk about. The <b>predicate</b> says something about the subject.</p><div class="rule">In an order like <i>Here comes the bus</i>, the subject can come after the verb.</div><p class="ex">Sit down. (the subject <b>you</b> is understood)</p>'],
['Phrase or clause?','<div class="rule"><b>Phrase</b>: makes sense but not complete sense. No subject + predicate of its own.</div><div class="rule"><b>Clause</b>: has its own subject and predicate.</div><p class="ex">of great beauty (phrase) / which is made of gold (clause)</p>'],
['Use decides the part of speech','<p>Eight parts of speech: noun, adjective, pronoun, verb, adverb, preposition, conjunction, interjection.</p><div class="rule">The same word can change class by its job. <b>after</b> is an adverb in <i>soon after</i>, a preposition in <i>after us</i>, a conjunction in <i>after we left</i>.</div>']],
Q:[
['m','Which is an INTERROGATIVE sentence?',['Where do you live?','Be quiet.','What a lovely day!','The sun rises in the east.'],0,'An interrogative sentence asks a question.'],
['m','"How cold the night is!" is a(n) ___ sentence.',['exclamatory','declarative','imperative','interrogative'],0,'It expresses strong feeling, so it is exclamatory.'],
['m','"Shut the door." is a(n) ___ sentence.',['imperative','declarative','exclamatory','interrogative'],0,'A command is imperative. The subject "you" is understood.'],
['m','In "Here comes the bus", the subject is:',['the bus','Here','comes','Here comes'],0,'The subject can follow the verb. Who or what comes? The bus.'],
['m','Which group of words is a CLAUSE?',['which is made of gold','of great beauty','in the east','under the bridge'],0,'A clause has its own subject (which) and predicate (is made of gold).'],
['m','Which is a PHRASE?',['in a corner','he sat down','when it rained','the boy laughed'],0,'"in a corner" makes sense but has no subject and predicate of its own.'],
['m','In "Sit down", the understood subject is:',['you','I','we','it'],0,'Imperative sentences address the listener: you.'],
['t','Tap the word that is the VERB.','The boy kicked the ball',2,'"kicked" shows the action.'],
['m','In "They arrived soon after", the word "after" is a(n):',['adverb','preposition','conjunction','adjective'],0,'It has no object and modifies the verb arrived, so it is an adverb.'],
['m','In "after us", the word "after" is a(n):',['preposition','adverb','conjunction','noun'],0,'It has an object (us), so it is a preposition.'],
['o','Arrange the words into a sentence.','Humpty Dumpty sat on a wall.','A declarative sentence: subject first, then predicate.'],
['m','Which sentence has a subject AFTER the verb?',['Sweet are the uses of adversity.','The boy stood on the burning deck.','Birds fly.','I like tea.'],0,'The subject "the uses of adversity" follows the verb "are".']]});
Z.push({id:'nou',n:'Noun Nation',ic:'N',c:'#ff9ec0',d:'Kinds, gender, number, case',
L:[['Kinds of noun','<div class="rule"><b>Proper</b>: particular name (Asoka, India)<br><b>Common</b>: class name (king, city)<br><b>Collective</b>: group as one (crowd, jury, fleet)<br><b>Abstract</b>: quality, action, state (kindness, theft, childhood)</div><p>Abstract nouns come from adjectives (kind > kindness), verbs (obey > obedience) and common nouns (child > childhood).</p>'],
['Gender','<div class="rule">Masculine, Feminine, <b>Common</b> (parent, child, pupil) and <b>Neuter</b> (book, pen, room).</div><p>Personification: <b>masculine</b> for strength (Sun, Death), <b>feminine</b> for beauty and gentleness (Moon, Spring, Mercy). A ship is <i>she</i>.</p><p class="ex">actor > actress, hero > heroine, peacock > peahen</p>'],
['Number: making plurals','<ul><li>Add <b>-s</b> (boy, boys)</li><li>-s, -sh, -ch, -x, most -o: add <b>-es</b> (class, box, hero)</li><li>consonant + y: <b>-ies</b> (baby, babies)</li><li>-f, -fe: <b>-ves</b> (thief, wife, leaf)</li><li>Irregular: man/men, ox/oxen, sheep/sheep</li></ul><p>Only -s for piano, photo, dynamo, solo. Mathematics, news, measles are singular.</p>'],

Q:[

['m','Possessive plural of "children":',["children's","childrens'","childrens","children'"],0,"Plural not ending in -s takes 's: children's."],
['t','Tap the word in the OBJECTIVE case.','Rama gave Hari a ball',2,'"Hari" is the indirect object. Rama is the subject.'],
['m','Choose the correct form.',["the boys' school","the boy's' school","the boys's school","the boys school's"],0,"Plural ending in -s: add an apostrophe only."]]});
Z.push({id:'adj',n:'Adjective Alley',ic:'A',c:'#7cc4ff',d:'Kinds, comparison, a / an / the',
L:[['Kinds of adjective','<ul><li><b>Quality</b>: clever, honest, Indian</li><li><b>Quantity</b>: some, much, little, enough</li><li><b>Number</b>: one (cardinal), first (ordinal), many, each, every</li><li><b>Demonstrative</b>: this, that</li><li><b>Interrogative</b>: what, which, whose</li></ul><p><b>Attributive</b> use is before the noun; <b>predicative</b> use is after the verb.</p>'],
['Degrees of comparison','<p>Positive: sweet. Comparative: sweeter (two). Superlative: sweetest (more than two).</p><div class="rule">One syllable: -er, -est. Long words: more, most. e: just -r, -st. consonant + y: y becomes i (happy, happier). Short vowel + consonant: double it (big, bigger).</div><p>Irregular: good, better, best. bad, worse, worst. Some words take <b>to</b>, not than: senior, junior, superior.</p>'],
['little, few, some, any','<div class="rule"><b>a little / a few</b>: some, positive.<br><b>little / few</b>: hardly any, negative.<br><b>the little / the few</b>: all there is or are.</div><p><b>Some</b> in affirmative and offers; <b>any</b> in negative and questions. <b>Each</b> for two or more; <b>every</b> for more than two.</p>'],
['Articles','<div class="rule"><b>a</b> before a consonant SOUND (a university). <b>an</b> before a vowel sound (an hour).</div><p>Use <b>the</b> for particular things, rivers, oceans, unique things (the sun), superlatives. Omit articles for general plurals, substances, abstract nouns, meals, languages.</p><p class="ex">a black and white dog (one) / a black and a white dog (two)</p>']],

['Relative pronouns','<div class="rule"><b>who</b> persons. <b>which</b> things and animals. <b>that</b> persons and things, restrictive. <b>what</b> = that which.</div><p><b>That</b> is preferred after superlatives, all, same, any, none, nothing, only, and after who / what.</p><p><b>Defining</b> clause: no commas. <b>Non-defining</b>: extra information in commas.</p>'],

L:[['Twelve forms','<p>Three tenses, four forms each: <b>Simple, Continuous, Perfect, Perfect Continuous</b>.</p><div class="rule">Present: loves / is loving / has loved / has been loving<br>Past: loved / was loving / had loved / had been loving<br>Future: will love / will be loving / will have loved / will have been loving</div>'],
['Present tenses','<ul><li><b>Simple</b>: habit and general truth. <i>The sun rises in the east.</i></li><li><b>Continuous</b>: now, or an arranged future. <i>I am leaving tomorrow.</i></li><li><b>Perfect</b>: past linked with now. <i>I have lived here since 2010.</i></li><li><b>Perfect continuous</b>: began earlier, continues. <i>I have been waiting for an hour.</i></li></ul><div class="rule">Never use the present perfect with a past-time word: not <i>He has come yesterday</i>.</div>'],
['Past tenses','<ul><li><b>Simple</b>: completed action, often with yesterday, last week, ago.</li><li><b>Continuous</b>: in progress at a past time. <i>It was raining when I left.</i></li><li><b>Past perfect</b>: the earlier of two past actions. <i>The train had left when I reached.</i></li></ul>'],
['Talking about the future','<ul><li><b>will</b>: facts, beliefs, instant decisions</li><li><b>going to</b>: plans and evidence now</li><li><b>be about to</b>: very soon</li><li><b>Simple present</b>: timetables; after if, when, unless</li><li><b>be to</b>: official plans</li></ul><p>Verbs of perception, emotion, thinking and possession (see, love, know, have) usually avoid the continuous.</p>']],

function tone(f,d,t='sine',v=.12,at=0){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+at+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+at);o.stop(AC.currentTime+at+d)}catch(e){}}
const sfx={ok(){tone(660,.12,'triangle');tone(880,.18,'triangle',.12,.1)},no(){tone(180,.25,'sawtooth',.08)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.12))},tick(){tone(420,.05,'square',.04)}};
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
/* ---------- shell ---------- */
let view='home',timers=[];
function clearTimers(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[]}
function topbar(){return `<div class="top"><div class="logo" data-act="home"><i>G</i><i>A</i><span style="margin-left:6px">Grammar Arena</span></div><div class="chips"><span class="chip">Lv ${lvl()}</span><span class="chip">${S.xp} XP</span><span class="chip">🔥 ${S.streak}</span><button class="chip snd" data-act="snd" aria-label="Toggle sound">${S.snd?'Sound on':'Sound off'}</button></div></div>`}
function mount(html){clearTimers();$('#app').innerHTML=topbar()+html;window.scrollTo(0,0)}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function unlocked(i){return i===0||((S.zones[Z[i-1].id]||{}).stars||0)>=1}
function home(){
  view='home';
  const zs=Z.map((z,i)=>{const st=(S.zones[z.id]||{}).stars||0,u=unlocked(i);
   return `<div class="zone ${u?'':'lock'}"><div class="ic" style="background:${z.c}">${z.ic}</div><b>${esc(z.n)}</b><small>${esc(z.d)}</small><span class="st">${stars(st)}</span><div class="acts"><button class="btn alt" data-act="lesson" data-z="${z.id}">Lesson</button><button class="btn go" data-act="quest" data-z="${z.id}" ${u?'':'disabled'}>${u?'Play':'Locked'}</button></div></div>`}).join('');
  const nw=S.wrong.length;
  mount(`<div class="hero"><h1>Learn grammar by <em>playing</em>.</h1><p>Nine zones from Wren &amp; Martin Book I. Read a quick lesson, win the round, unlock the next zone. Then challenge your wife live.</p></div>
  <div class="namebox"><label for="nm">Your name</label><input type="text" id="nm" maxlength="14" placeholder="Player" value="${esc(S.name)}"></div>
  <div class="modes">
   <button class="mode duel" data-act="duel"><span class="tag">Live, 2 players</span><b>Duel with partner</b><span>Same questions, same time, two screens. Share a room code.</span></button>
   <button class="mode" data-act="daily"><b>Daily Challenge</b><span>10 mixed questions, new set every day.</span></button>
   <button class="mode" data-act="boss"><b>Boss Battle</b><span>12 mixed questions from every zone. 3 lives.</span></button>
   <button class="mode" data-act="review"><b>Review Mistakes</b><span>${nw?nw+' question'+(nw>1?'s':'')+' to fix. Clear them all.':'Nothing yet. Missed questions land here.'}</span></button>
  </div>
  <h2 class="sec">Quest Map</h2><div class="zones">${zs}</div>
  <p class="note" style="margin-top:22px">Progress is saved in this browser. Each round gives XP, and a streak counts days played in a row.</p>`);
}
function lesson(zid,idx=0){
  const z=ZB[zid],L=z.L[idx];view='lesson';
  mount(`<button class="back" data-act="home">‹ Back to map</button><div class="qtype" style="margin-top:6px">${esc(z.n)} · Lesson ${idx+1} of ${z.L.length}</div><div class="lcard pop"><h3>${esc(L[0])}</h3>${L[1]}</div><div class="dots">${z.L.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div><div class="row"><button class="btn alt" data-act="lnav" data-z="${zid}" data-i="${idx-1}" ${idx?'':'disabled'}>‹ Previous</button>${idx<z.L.length-1?`<button class="btn" data-act="lnav" data-z="${zid}" data-i="${idx+1}">Next ›</button>`:`<button class="btn go" data-act="quest" data-z="${zid}">Play this zone</button>`}</div>`);
}
function result(g){
  view='result';const pct=Math.round(100*g.correct/g.qs.length);
  let star=0,head='Round over';
  if(g.mode==='quest'){star=g.lives<=0?0:pct>=100?3:pct>=80?2:pct>=60?1:0;head=star?'Zone cleared':'Try again';
   const zr=S.zones[g.zid]||{stars:0};if(star>zr.stars)zr.stars=star;S.zones[g.zid]=zr}
  else head=g.mode==='review'?'Review done':g.mode==='boss'?(pct>=70?'Boss defeated':'The boss wins this time'):'Challenge complete';
  const gain=g.xp+(star*20);S.xp+=gain;S.played++;bumpStreak();save();if(star||pct>=70)sfx.win();
  const ms=g.missed.map(k=>BYK[k]).filter(Boolean);
  mount(`<div class="card center pop"><div class="qtype">${esc(head)}</div><div class="big">${pct}%</div>${g.mode==='quest'?`<div class="stars">${stars(star)}</div>`:''}<p>${g.correct} of ${g.qs.length} correct · best combo ${g.best} · <b>+${gain} XP</b></p>
  ${ms.length?`<div class="mist"><b>Fix these next time</b><ul>${ms.map(x=>`<li>${esc(x.q[1])} <b style="color:var(--mint)">${esc(ansText(x.q))}</b></li>`).join('')}</ul></div>`:'<p>No mistakes. Perfect.</p>'}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn alt" data-act="home">Map</button><button class="btn go" data-act="again">Play again</button></div></div>`);
  lastGame=g;
}
function ansText(q){return q[0]==='m'?q[2][q[3]]:q[0]==='t'?q[2].split(' ')[q[3]]:q[2]}
let lastGame=null;
/* ---------- question builder ---------- */
function buildQ(it,rng){const q=it.q,t=q[0];
 if(t==='m')return{k:it.k,t,text:q[1],opts:shuf(q[2].map((o,i)=>({o,ok:i===q[3]})),rng),exp:q[4]};
 if(t==='t')return{k:it.k,t,text:q[1],words:q[2].split(' '),a:q[3],exp:q[4]};
 let w=q[2].split(' ').map((x,i)=>({w:x,id:i}));let s=shuf(w,rng);if(s.every((x,i)=>x.id===i))s.reverse();
 return{k:it.k,t:'o',text:q[1],words:s,full:q[2],exp:q[3],tray:[]}}
const QLAB={m:'Choose the answer',t:'Tap the word',o:'Build the sentence'};
let g=null,D=null,RM=null;
function startGame(mode,o={}){
  let items=[],seed=null;
  if(mode==='quest'){const z=ZB[o.zid];items=shuf(ALL.filter(x=>x.z===z.id),Math.random).slice(0,8)}
  else if(mode==='boss')items=shuf(ALL,Math.random).slice(0,12);
  else if(mode==='daily'){seed='daily'+today();items=shuf(ALL,rngOf(seed)).slice(0,10)}
  else if(mode==='review'){items=shuf(S.wrong.map(k=>BYK[k]).filter(Boolean),Math.random).slice(0,8);if(!items.length){toast('No mistakes saved yet. Play a zone first.');return}}
  else if(mode==='duel'){seed=o.seed;const pool=o.zn==='mix'?ALL:ALL.filter(x=>x.z===o.zn);items=shuf(pool,rngOf(seed)).slice(0,10)}
  const br=seed?rngOf(seed+'b'):Math.random;
  g={mode,zid:o.zid,zn:o.zn,seed,qs:items.map(it=>buildQ(it,br)),i:0,lives:(mode==='quest'||mode==='boss')?3:99,correct:0,combo:0,best:0,xp:0,missed:[],answered:false,sc:0,t0:0,left:0};
  view='play';renderPlay();showQ();
}
function hud(){const dm=g.mode==='duel',h=(g.mode==='quest'||g.mode==='boss')?`<div class="hearts" id="hearts">${'♥'.repeat(Math.max(g.lives,0))}</div>`:'';
 return `<div class="hud"><button class="back" data-act="quit">✕</button><div class="bar"><div id="prog"></div></div>${h}</div>${dm?`<div class="timer"><div id="tbar"></div></div>`:''}`}
function renderPlay(){
  mount(`${hud()}${g.mode==='duel'?`<div class="vs" id="vs"></div>`:''}<div class="card" id="qa"></div>`);
  if(g.mode==='duel')vsRender();
}
function showQ(){
  const q=g.qs[g.i];g.answered=false;g.t0=Date.now();
  $('#prog').style.width=(100*g.i/g.qs.length)+'%';
  let b=`<div class="qtype">Question ${g.i+1} of ${g.qs.length} · ${QLAB[q.t]}${g.combo>1?` · <span class="combo">combo x${g.combo}</span>`:''}</div><div class="q">${esc(q.text)}</div>`;
  if(q.t==='m')b+=`<div class="opts ${q.opts.every(o=>o.o.length<18)?'two':''}">${q.opts.map((o,i)=>`<button class="tile" data-act="pick" data-i="${i}"><span class="k">${'ABCD'[i]}</span>${esc(o.o)}</button>`).join('')}</div>`;
  else if(q.t==='t'){b+=`<p class="note">Read the sentence and tap one word.</p><div class="words">${q.words.map((w,i)=>`<button class="tile" data-act="tag" data-i="${i}">${esc(w)}</button>`).join('')}</div>`}
  else b+=`<div class="tray" id="tray"></div><div class="words" id="bank"></div><button class="btn go" data-act="check" id="chk" disabled>Check</button>`;
  b+=`<div class="fb" id="fb"></div>`;
  $('#qa').innerHTML=b;$('#qa').classList.remove('pop');void $('#qa').offsetWidth;$('#qa').classList.add('pop');
  if(q.t==='o')drawOrder();
  if(g.mode==='duel'){startTimer();dPresence({r:g.i,d:0,ok:null,sc:g.sc})}
}
function drawOrder(){const q=g.qs[g.i];
  $('#tray').innerHTML=q.tray.map(x=>`<button class="tile" data-act="untray" data-id="${x.id}">${esc(x.w)}</button>`).join('');
  const inT=new Set(q.tray.map(x=>x.id));
  $('#bank').innerHTML=q.words.filter(x=>!inT.has(x.id)).map(x=>`<button class="tile" data-act="tobank" data-id="${x.id}">${esc(x.w)}</button>`).join('');
  $('#chk').disabled=q.tray.length!==q.words.length}
function startTimer(){const T=25000;const id=setInterval(()=>{if(!g||g.mode!=='duel'){clearInterval(id);return}
  const left=Math.max(0,T-(Date.now()-g.t0));g.left=left;const tb=$('#tbar');if(tb)tb.style.width=(100*left/T)+'%';
  if(left<=0&&!g.answered){clearInterval(id);answer(false,true)}if(g.answered)clearInterval(id)},100);timers.push(id)}
function answer(ok,timeout,detail){
  if(g.answered)return;g.answered=true;const q=g.qs[g.i];
  if(ok){g.correct++;g.combo++;g.best=Math.max(g.best,g.combo);g.xp+=10+Math.min(g.combo,5)*2;sfx.ok();S.wrong=S.wrong.filter(k=>k!==q.k)}
  else{g.combo=0;if(g.lives<99)g.lives--;sfx.no();g.missed.push(q.k);if(!S.wrong.includes(q.k))S.wrong.push(q.k);if(S.wrong.length>60)S.wrong.shift();const a=$('#qa');if(a){a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}}
  save();const hh=$('#hearts');if(hh)hh.textContent='♥'.repeat(Math.max(g.lives,0));
  let pts=0;if(g.mode==='duel'){pts=ok?100+Math.round(50*(g.left||0)/25000):0;g.sc+=pts;dPresence({r:g.i,d:1,ok:ok?1:0,sc:g.sc})}
  const last=g.i===g.qs.length-1||g.lives<=0;
  const fb=$('#fb');fb.className='fb show '+(ok?'good':'bad');
  fb.innerHTML=`<b>${ok?'Correct':timeout?'Time is up':'Not quite'}${pts?` · +${pts}`:''}</b><p>${esc(q.exp)}${!ok&&q.t==='o'?`<br><b>${esc(q.full)}</b>`:''}</p>`+(g.mode==='duel'?`<p class="note" id="dwait"></p>`:`<button class="btn ${ok?'go':'hot'}" data-act="next">${last?'See result':'Continue'}</button>`);
  $('#prog').style.width=(100*(g.i+1)/g.qs.length)+'%';
  if(g.mode==='duel')duelCheck();
}
function nextQ(){
  if(g.mode==='duel'){if(g.i>=g.qs.length-1){duelEnd();return}g.i++;showQ();return}
  if(g.i>=g.qs.length-1||g.lives<=0){result(g);return}g.i++;showQ();
}
/* ---------- duel (live, room presence only) ---------- */
function dPresence(p){if(D&&D.room)D.room.presence(p).catch(()=>{})}
function opp(){if(!D||!D.room)return null;return D.room.peers().find(p=>!p.isMe&&p.presence&&p.presence.nm)||null}
function oppDone(r){const o=opp();if(!o)return true;const p=o.presence;return p.r>r||(p.r===r&&p.d===1)}
function vsRender(){const el=$('#vs');if(!el||!g||g.mode!=='duel')return;const o=opp(),p=o?o.presence:null;
  el.innerHTML=`<div class="pl me"><small>You</small><b>${esc(S.name||'Player')}</b><div class="sc">${g.sc}</div></div><div class="vsx">VS</div><div class="pl opp"><small>${o?(p.d===1&&p.r===g.i?'answered':'thinking'):'left the room'}</small><b>${o?esc(String(p.nm).slice(0,14)):'Partner'}</b><div class="sc">${p&&p.sc?p.sc:0}</div></div>`}
let adv=null;
function duelCheck(){vsRender();if(!g||g.mode!=='duel'||!g.answered)return;
  const w=$('#dwait');const last=g.i>=g.qs.length-1;
  if(oppDone(g.i)){if(adv)return;if(w)w.innerHTML=`<button class="btn go" data-act="next">${last?'See result':'Next question'}</button> <span class="note">auto in a moment</span>`;adv=setTimeout(()=>{adv=null;if(g&&g.mode==='duel'&&g.answered)nextQ()},last?3500:4500);timers.push(adv)}
  else if(w)w.textContent='Waiting for your partner to answer...'}
function duelEnd(){
  const o=opp(),os=o&&o.presence.sc?o.presence.sc:0,nm=o?String(o.presence.nm).slice(0,14):'Partner';
  const S1=g.sc,win=S1>os?'You win':S1<os?nm+' wins':'A draw';const xpg=g.xp+(S1>=os?30:10);S.xp+=xpg;S.played++;bumpStreak();save();sfx.win();
  const gg=g;view='duelend';
  mount(`<div class="card center pop"><div class="qtype">Duel finished</div><div class="big">${esc(win)}</div><div class="vs" style="margin-top:14px"><div class="pl me"><small>You</small><b>${esc(S.name||'Player')}</b><div class="sc">${S1}</div></div><div class="vsx">VS</div><div class="pl opp"><small>${o?'partner':'left'}</small><b>${esc(nm)}</b><div class="sc">${os}</div></div></div><p>You got ${gg.correct} of ${gg.qs.length} right · <b>+${xpg} XP</b> · Team total <b>${S1+os}</b></p><div class="row" style="justify-content:center"><button class="btn alt" data-act="leave">Leave room</button><button class="btn go" data-act="rematch">Back to room</button></div></div>`);
  g=null;
}
function duelLobby(){
  view='duel';
  const ok=!!(window.claude&&window.claude.use);
  mount(`<button class="back" data-act="home">‹ Back</button><h2 class="sec" style="margin-top:6px">Duel with your partner</h2><div class="card"><p>You both answer the same ten questions at the same time. Faster correct answers earn more points. Open this page on two devices, then one of you creates a room and the other types the code.</p>
  <div class="namebox"><label for="nm">Your name</label><input type="text" id="nm" maxlength="14" placeholder="Player" value="${esc(S.name)}"></div>
  <div class="row" style="gap:16px;align-items:flex-end"><button class="btn hot" data-act="mkroom">Create a room</button><div class="namebox" style="margin:0"><input type="text" id="jc" maxlength="4" placeholder="CODE" style="width:110px;text-transform:uppercase;letter-spacing:4px"><button class="btn go" data-act="joinroom">Join</button></div></div>
  <p class="note" id="dmsg" style="margin-top:12px">${ok?'Both players open this same website, then one creates a room and the other joins with the code.':'Live play could not start in this browser. Solo modes still work.'}</p></div>`);
}
async function enterRoom(code,host){
  const msg=$('#dmsg');
  try{if(!RM){RM=await window.claude.use('room')}}catch(e){RM=null}
  if(!RM){if(msg)msg.textContent='Could not reach the live server. Check your internet and reload the page.';return}
  try{const room=await RM.join('ga-'+code.toLowerCase(),host);
   if(D&&D.un)D.un();
   D={code,room,host,st:0,zn:'mix'};
   room.presence({nm:S.name||'Player',host:host?1:0,r:-1,d:0,sc:0,st:null,zn:'mix'}).catch(()=>{});
   D.un=room.onPeers(()=>{if(view==='wait')waitRender();else if(g&&g.mode==='duel')duelCheck();joinerWatch()});
   view='wait';waitRender();
  }catch(e){if(msg)msg.textContent='Room not found. Ask the host to create a room first and keep the page open, then check the 4-letter code.'}
}
function joinerWatch(){if(!D||D.host||view!=='wait')return;const h=D.room.peers().find(p=>!p.isMe&&p.presence&&p.presence.host===1&&p.presence.st);
  if(h&&h.presence.st!==D.st){D.st=h.presence.st;launchDuel(h.presence.st,h.presence.zn||'mix')}}
function waitRender(){
  if(!D)return;const o=opp();
  const zsel=D.host?`<div class="namebox" style="justify-content:center"><label for="zsel">Topic</label><select id="zsel" style="background:var(--board2);color:var(--chalk);border:2px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-weight:800;max-width:100%"><option value="mix">All zones mixed</option>${Z.map(z=>`<option value="${z.id}" ${D.zn===z.id?'selected':''}>${esc(z.n)}</option>`).join('')}</select></div>`:'';
  mount(`<div class="card center"><div class="qtype">Room code</div><div class="code">${esc(D.code)}</div><p class="note">Tell your partner this code.</p>
  <div class="vs"><div class="pl me"><small>You</small><b>${esc(S.name||'Player')}</b></div><div class="vsx">VS</div><div class="pl opp"><small>${o?'in the room':'waiting'}</small><b>${o?esc(String(o.presence.nm).slice(0,14)):'...'}</b></div></div>
  ${zsel}${D.host?`<button class="btn go" data-act="start" ${o?'':'disabled'}>${o?'Start the duel':'Waiting for partner'}</button>`:`<p>${o?'Waiting for the host to start...':'Joining...'}</p>`}<div style="margin-top:14px"><button class="btn alt" data-act="leave">Leave room</button></div></div>`);
}
function launchDuel(st,zn){D.zn=zn;adv=null;dPresence({r:-1,d:0,sc:0,ok:null});startGame('duel',{seed:D.code+':'+st,zn})}
function hostStart(){const o=opp();if(!o){toast('Your partner has not joined yet');return}
  const zn=($('#zsel')||{}).value||'mix';D.zn=zn;const st=Date.now();D.st=st;dPresence({st,zn,r:-1,d:0,sc:0});launchDuel(st,zn)}
function leaveRoom(){try{if(D&&D.un)D.un();if(D&&D.room)D.room.leave()}catch(e){}D=null;g=null;home()}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='home'){if(D){/* leaving to map keeps room closed */leaveRoom();return}home()}
  else if(a==='snd'){S.snd=!S.snd;save();el.textContent=S.snd?'Sound on':'Sound off';if(S.snd)sfx.ok()}
  else if(a==='lesson')lesson(el.dataset.z,0);
  else if(a==='lnav')lesson(el.dataset.z,+el.dataset.i);
  else if(a==='quest')startGame('quest',{zid:el.dataset.z});
  else if(a==='daily'||a==='boss'||a==='review')startGame(a);
  else if(a==='again'){const l=lastGame;if(l&&l.mode==='quest')startGame('quest',{zid:l.zid});else if(l)startGame(l.mode);else home()}
  else if(a==='quit'){if(g&&g.mode==='duel'){leaveRoom()}else{g=null;home()}}
  else if(a==='next'){if(adv){clearTimeout(adv);adv=null}nextQ()}
  else if(a==='pick'&&g&&!g.answered){const q=g.qs[g.i],i=+el.dataset.i;document.querySelectorAll('#qa .tile').forEach((t,j)=>{t.disabled=true;if(q.opts[j].ok)t.classList.add('ok')});if(!q.opts[i].ok)el.classList.add('no');answer(q.opts[i].ok)}
  else if(a==='tag'&&g&&!g.answered){const q=g.qs[g.i],i=+el.dataset.i,ok=i===q.a;document.querySelectorAll('#qa .tile').forEach((t,j)=>{t.disabled=true;if(j===q.a)t.classList.add('ok')});if(!ok)el.classList.add('no');answer(ok)}
  else if(a==='tobank'&&g&&!g.answered){const q=g.qs[g.i];q.tray.push(q.words.find(x=>x.id===+el.dataset.id));drawOrder()}
  else if(a==='untray'&&g&&!g.answered){const q=g.qs[g.i];q.tray=q.tray.filter(x=>x.id!==+el.dataset.id);drawOrder()}
  else if(a==='check'&&g&&!g.answered){const q=g.qs[g.i];answer(q.tray.map(x=>x.w).join(' ')===q.full);document.querySelectorAll('#qa .tile').forEach(t=>t.disabled=true);el.disabled=true}
  else if(a==='duel')duelLobby();
  else if(a==='mkroom'){const c=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random()*23)]).join('');enterRoom(c,true)}
  else if(a==='joinroom'){const c=($('#jc').value||'').trim().toUpperCase();if(c.length!==4){$('#dmsg').textContent='Type the 4-letter code.';return}enterRoom(c,false)}
  else if(a==='start')hostStart();
  else if(a==='leave')leaveRoom();
  else if(a==='rematch'){view='wait';dPresence({r:-1,d:0,sc:0});waitRender();joinerWatch()}
});
document.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.slice(0,14);save();dPresence({nm:S.name||'Player'})}});
document.addEventListener('keydown',e=>{if(!g||g.answered)return;const q=g.qs[g.i];if(q&&q.t==='m'&&'1234'.includes(e.key)&&q.opts[+e.key-1]){const b=document.querySelectorAll('#qa .tile')[+e.key-1];if(b)b.click()}});
home();
</script>
</html>
